name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag, plugin header, stable tag, config constant and changelog agree
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          header=$(grep -m1 '^ \* Version:' bestony-ai-provider.php | awk '{print $3}')
          stable=$(grep -m1 '^Stable tag:' readme.txt | awk '{print $3}')
          # The User-Agent is built from this constant, so it drifts silently if it is not checked.
          config=$(perl -ne "print \$1 if /const VERSION = '([\d.]+)'/" src/Util/XiaomimimoConfig.php)
          for pair in "header:$header" "stable tag:$stable" "config VERSION:$config"; do
            name="${pair%%:*}"
            value="${pair#*:}"
            if [ "$tag" != "$value" ]; then
              echo "tag $tag != $name $value" >&2
              exit 1
            fi
          done
          # A release with no changelog entry publishes empty release notes, so fail instead.
          if ! grep -qx "= ${tag} =" readme.txt; then
            echo "readme.txt has no '= ${tag} =' changelog entry" >&2
            exit 1
          fi

      - name: Verify the plugin's own self-check passes
        run: |
          set -euo pipefail
          # No --sdk: the SDK is not vendored, so only the WordPress-free checks can run here.
          php scripts/selfcheck.php

      - name: Build plugin zip
        run: |
          set -euo pipefail
          slug=bestony-ai-provider
          zip="build/$slug-${GITHUB_REF_NAME}.zip"
          mkdir -p build
          # .gitattributes export-ignores scripts/, README.md and the CI files.
          git archive --format=zip --prefix="$slug/" -o "$zip" HEAD
          unzip -l "$zip" | grep -q "$slug/$slug.php"

      - name: Compose release notes
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          {
            awk -v v="$version" '$0 == "= " v " =" {found=1; next} found && /^= / {exit} found' readme.txt
            echo
            echo "**Commits**"
            prev=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
            if [ -n "$prev" ]; then
              git log --pretty='- %s (%h)' "$prev..$GITHUB_REF_NAME"
            else
              git log --pretty='- %s (%h)' "$GITHUB_REF_NAME"
            fi
          } > RELEASE_NOTES.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/*.zip \
            --title "$GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md

  wporg:
    needs: release
    runs-on: ubuntu-latest
    environment: wordpress.org
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Subversion client
        run: sudo apt-get update && sudo apt-get install -y subversion

      - name: Create staging directory
        id: staging
        run: |
          set -euo pipefail
          wporg_slug=bestony-ai-provider
          version="${GITHUB_REF_NAME#v}"
          STAGE_DIR=$(mktemp -d /tmp/wporg-staging-XXXXXX)

          # Copy all files preserving structure.
          cp -a . "$STAGE_DIR/."

          # Remove development-only directories/files.
          rm -rf "$STAGE_DIR/.git"
          rm -rf "$STAGE_DIR/.github"
          rm -rf "$STAGE_DIR/.svn"
          rm -rf "$STAGE_DIR/.commandcode"
          rm -rf "$STAGE_DIR/scripts"
          rm -rf "$STAGE_DIR/.wordpress-org"
          rm -f "$STAGE_DIR/assets/images/xiaomimimo.svg"

          echo "stage_dir=$STAGE_DIR" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_ENV"
          echo "wporg_slug=$wporg_slug" >> "$GITHUB_ENV"

          echo "stage_dir=$STAGE_DIR" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "wporg_slug=$wporg_slug" >> "$GITHUB_OUTPUT"

      - name: Deploy to WordPress.org SVN
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
        run: |
          set -euo pipefail
          slug="$wporg_slug"
          version="$version"
          stage_dir="$stage_dir"

          TRUNK_URL="https://plugins.svn.wordpress.org/$slug/trunk"
          TAG_PATH="https://plugins.svn.wordpress.org/$slug/tags/$version"

          echo "=== WordPress.org Deployment ==="
          echo "Plugin slug : $slug"
          echo "Version     : $version"
          echo ""

          # Check if this is the first-ever deployment (no trunk exists).
          IS_NEW=false
          if svn ls "$TRUNK_URL" >/dev/null 2>&1; then
            echo "Existing trunk detected — updating via checkout + commit"
          else
            echo "No existing trunk — performing initial import"
            IS_NEW=true
          fi

          if [ "$IS_NEW" = false ]; then
            # Update existing trunk: checkout, rsync, commit.
            TMPDIR_WS=$(mktemp -d /tmp/wporg-ws-XXXXXX)
            trap 'rm -rf "$TMPDIR_WS"' EXIT

            svn checkout --non-interactive "$TRUNK_URL" "$TMPDIR_WS/trunk"
            cd "$TMPDIR_WS/trunk"
            rsync -av --delete --exclude=.svn "$stage_dir/" ./
            svn status | grep -v '^ ? .*/README\.md$' | grep '?' || true
            svn add --force --auto-props --parents --depth infinity --no-unversioned --quiet
            svn ci --username "$SVN_USERNAME" --password "$SVN_PASSWORD" \
              --non-interactive --trust-server-cert \
              -m "$version: Update trunk to version $version ($slug)"
          else
            # First-time import: just import the staged dir directly.
            svn import "$stage_dir" "$TRUNK_URL" \
              --username "$SVN_USERNAME" --password "$SVN_PASSWORD" \
              --non-interactive --trust-server-cert \
              -m "$version: Initial import to WordPress.org plugin directory ($slug)"
          fi

          # Always import the tag (works whether it exists or not — fails if already present).
          echo ""
          echo "Creating tag $version ..."
          svn import "$stage_dir" "$TAG_PATH" \
            --username "$SVN_USERNAME" --password "$SVN_PASSWORD" \
            --non-interactive --trust-server-cert \
            -m "$version: Tagged release $version ($slug)"

          echo ""
          echo "================================="
          echo "Trunk: https://plugins.svn.wordpress.org/$slug/"
          echo "Tag  : $TAG_PATH"
          echo "Live : https://wordpress.org/plugins/$slug/"
